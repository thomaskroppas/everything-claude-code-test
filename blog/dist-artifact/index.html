<title>Отсечка</title>
<meta name="description" content="Журнал об автомобилях: история, устройство, вождение и культура">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=Unbounded:wght@500;600;700;800&display=swap">
<style>
/* Layout: instrument-cluster masthead with a 24-segment rev bar; magazine grid below; long-read column with a sticky "spec sheet" rail. */
:root {
  --bg: #eceef0;          /* light asphalt */
  --surface: #ffffff;
  --ink: #14171c;
  --muted: #586270;
  --line: #ccd2d9;
  --accent: #ffc21a;      /* road-marking yellow, used as fill only */
  --on-accent: #14171c;
  --amber: #ef8a17;
  --red: #d63a20;         /* redline, used only on the rev bar and warnings */
  --focus: #1d5fd1;
  --font-display: 'Unbounded', 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
  --font-body: 'Literata', Georgia, 'Times New Roman', serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --step--1: 0.8125rem;
  --step-0: 1.0625rem;
  --step-1: 1.25rem;
  --step-2: 1.6rem;
  --step-3: clamp(1.9rem, 1.4rem + 2vw, 2.7rem);
  --step-4: clamp(2.2rem, 1.5rem + 3.2vw, 3.6rem);
  --radius: 6px;
  --gutter: clamp(16px, 4vw, 40px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111316; --surface: #1a1d22; --ink: #e8ebee; --muted: #9aa4b0; --line: #2c323a;
    --accent: #ffc21a; --on-accent: #14171c; --amber: #ffa23a; --red: #ff5a3d; --focus: #7fb0ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111316; --surface: #1a1d22; --ink: #e8ebee; --muted: #9aa4b0; --line: #2c323a;
  --accent: #ffc21a; --on-accent: #14171c; --amber: #ffa23a; --red: #ff5a3d; --focus: #7fb0ff;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 9rem; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 var(--step-0)/1.6 var(--font-body);
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}
img, svg { max-width: 100%; display: block; }
a { color: inherit; text-decoration-color: currentColor; text-decoration-thickness: 3px; text-underline-offset: 3px; }
a:hover { text-decoration-color: var(--accent); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: var(--step--1); letter-spacing: 0.01em; }
.wrap { width: 100%; max-width: 1240px; margin-inline: auto; padding-inline: var(--gutter); }
.narrow { max-width: 780px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -999px; top: 0; background: var(--accent); color: var(--on-accent); padding: 0.6rem 1rem; z-index: 50; font-family: var(--font-mono); }
.skip:focus { left: 1rem; top: 1rem; }
.label, .eyebrow {
  font-family: var(--font-mono); font-size: 0.75rem; font-weight: 600;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
}
.eyebrow { display: flex; align-items: center; gap: 0.5rem; }

/* ---------- masthead ---------- */
.masthead {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.masthead__row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding-block: 0.9rem 0.4rem; flex-wrap: wrap; }
.wordmark {
  font-family: var(--font-display); font-weight: 800; font-size: clamp(1.35rem, 1rem + 1.6vw, 1.9rem);
  letter-spacing: 0.04em; text-decoration: none; line-height: 1; display: inline-flex; align-items: baseline; gap: 0.6rem;
}
.wordmark__rpm { font-family: var(--font-mono); font-size: 0.75rem; font-weight: 500; letter-spacing: 0.08em; color: var(--muted); }
.wordmark--small { font-size: 1.2rem; margin-bottom: 0.75rem; }
.masthead__tools { display: flex; gap: 0.25rem; flex-wrap: wrap; }
.tool {
  font-family: var(--font-mono); font-size: var(--step--1); text-decoration: none; color: var(--ink);
  padding: 0.4rem 0.7rem; border-radius: 999px; border: 1px solid transparent; background: none; cursor: pointer;
}
.tool:hover { border-color: var(--line); }
.tool[aria-current="page"] { background: var(--ink); color: var(--bg); }
.catnav { display: flex; gap: 0.15rem; overflow-x: auto; scrollbar-width: none; padding-block: 0.15rem 0.5rem; }
.catnav::-webkit-scrollbar { display: none; }
.catnav a {
  flex: none; font-family: var(--font-display); font-weight: 500; font-size: 0.82rem; text-decoration: none;
  padding: 0.35rem 0.7rem; border-radius: var(--radius); color: var(--muted);
}
.catnav a:hover { color: var(--ink); background: var(--surface); }
.catnav a[aria-current="page"] { color: var(--on-accent); background: var(--accent); }

/* rev bar: idle shows the first segments lit; on articles it tracks reading progress */
.revbar { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; height: 5px; padding-inline: var(--gutter); max-width: 1240px; margin: 0 auto 6px; }
.revbar i { background: var(--line); border-radius: 1px; transition: background-color 120ms linear; }
.revbar:not(.revbar--progress) i:nth-child(-n+4) { background: var(--ink); }
.revbar i.on { background: var(--ink); }
.revbar i.amber.on { background: var(--amber); }
.revbar i.red { box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--red) 55%, transparent); }
.revbar i.red.on { background: var(--red); }

/* ---------- shared bits ---------- */
.meta { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; color: var(--muted); }
.chip {
  font-family: var(--font-display); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
  text-decoration: none; padding: 0.22rem 0.5rem; border-radius: 3px; color: var(--ink);
  background: color-mix(in srgb, var(--cat) 18%, var(--surface)); border: 1px solid color-mix(in srgb, var(--cat) 45%, var(--line));
}
.chip:hover { background: color-mix(in srgb, var(--cat) 30%, var(--surface)); }
.swatch { display: inline-block; width: 0.8em; height: 0.8em; border-radius: 2px; background: var(--cat); flex: none; }
.chip--history, .swatch--history { --cat: #8a5d34; }
.chip--tech, .swatch--tech { --cat: #2f6690; }
.chip--electric, .swatch--electric { --cat: #23826b; }
.chip--service, .swatch--service { --cat: #6b737d; }
.chip--driving, .swatch--driving { --cat: #5f7a2e; }
.chip--buying, .swatch--buying { --cat: #8e3c67; }
.chip--motorsport, .swatch--motorsport { --cat: #b2321f; }
.chip--culture, .swatch--culture { --cat: #5a52b5; }
.section-title {
  font-family: var(--font-display); font-weight: 700; font-size: var(--step-2);
  margin-block: 3.5rem 1.25rem; display: flex; align-items: center; gap: 0.75rem;
}
.section-title::after { content: ""; flex: 1; height: 2px; background: var(--ink); opacity: 0.85; }

/* ---------- lead story ---------- */
.lead { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: clamp(1.25rem, 3vw, 3rem); align-items: center; padding-block: 2rem 0.5rem; }
.lead__media { display: block; border-radius: var(--radius); overflow: hidden; aspect-ratio: 16 / 10; max-width: 100%; }
.lead__media svg, .lead__media img { width: 100%; height: 100%; object-fit: cover; transition: transform 600ms cubic-bezier(.2,.7,.2,1); }
.lead__media:hover svg, .lead__media:hover img { transform: scale(1.03); }
.lead__body { display: flex; flex-direction: column; gap: 1rem; min-width: 0; }
.lead__title { font-family: var(--font-display); font-weight: 700; font-size: var(--step-3); line-height: 1.12; letter-spacing: -0.01em; }
.lead__title a { text-decoration: none; }
.lead__title a:hover { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 5px; }
.lead__excerpt { font-size: var(--step-1); color: var(--muted); max-width: 46ch; }

/* ---------- grids & cards ---------- */
.grid { display: grid; gap: clamp(1rem, 2vw, 1.75rem); }
.grid--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid--4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.card { display: flex; flex-direction: column; gap: 0.8rem; min-width: 0; }
.card__media { display: block; aspect-ratio: 16 / 10; border-radius: var(--radius); overflow: hidden; max-width: 100%; }
.card__media svg, .card__media img { width: 100%; height: 100%; object-fit: cover; transition: transform 500ms cubic-bezier(.2,.7,.2,1); }
.card:hover .card__media svg, .card:hover .card__media img { transform: scale(1.04); }
.card__body { display: flex; flex-direction: column; gap: 0.5rem; }
.card__title { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; line-height: 1.3; letter-spacing: -0.005em; }
.card--compact .card__title { font-size: 0.95rem; }
.card__title a { text-decoration: none; }
.card__title a:hover { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 3px; }
.card__excerpt { color: var(--muted); font-size: 0.98rem; line-height: 1.55; }

/* category shelves on the home page */
.shelf { padding-block: 2.5rem 0.5rem; border-top: 2px solid var(--ink); margin-top: 3rem; }
.shelf__head { display: flex; align-items: baseline; gap: 0.5rem 1.25rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
.shelf__title { font-family: var(--font-display); font-weight: 700; font-size: var(--step-2); display: flex; align-items: center; gap: 0.6rem; }
.shelf__blurb { color: var(--muted); flex: 1 1 18rem; min-width: 0; }
.more { font-family: var(--font-mono); font-size: var(--step--1); white-space: nowrap; }

/* ---------- spec sheet ("паспорт") ---------- */
.spec { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; margin: 0; }
.spec > div { background: var(--surface); padding: 0.75rem 0.9rem; display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; }
.spec dt { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.spec dd { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; line-height: 1.25; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.spec--small dd { font-size: 0.95rem; }

/* ---------- article ---------- */
.post__head { max-width: 980px; padding-block: 2.5rem 1.75rem; display: flex; flex-direction: column; gap: 1.1rem; }
.post__title { font-family: var(--font-display); font-weight: 700; font-size: var(--step-4); line-height: 1.08; letter-spacing: -0.015em; }
.post__lede { font-size: var(--step-1); color: var(--muted); max-width: 52ch; line-height: 1.5; }
.post__byline { display: flex; flex-wrap: wrap; gap: 0.4rem 1.25rem; color: var(--muted); }
.post__byline span::before { content: "·"; margin-right: 1.25rem; }
.post__cover { margin-block: 0 2.5rem; }
.post__cover svg { width: 100%; aspect-ratio: 21 / 9; border-radius: var(--radius); }
.post__layout { display: grid; grid-template-columns: 17rem minmax(0, 1fr); gap: clamp(1.5rem, 4vw, 4rem); align-items: start; }
.post__side { position: sticky; top: 9.5rem; display: flex; flex-direction: column; gap: 0.75rem; }
.post__side .spec { grid-template-columns: 1fr; }
.toc { margin-top: 1rem; }
.toc ol { list-style: none; padding: 0; margin: 0.6rem 0 0; display: flex; flex-direction: column; border-left: 2px solid var(--line); }
.toc a { display: block; padding: 0.35rem 0 0.35rem 0.85rem; margin-left: -2px; border-left: 2px solid transparent; text-decoration: none; font-size: 0.88rem; line-height: 1.35; color: var(--muted); }
.toc a:hover { color: var(--ink); }
.toc a.active { color: var(--ink); border-left-color: var(--accent); }

.prose { max-width: 68ch; min-width: 0; font-size: 1.12rem; line-height: 1.72; }
.prose > * + * { margin-top: 1.15em; }
.post .prose > p:first-child::first-letter {
  font-family: var(--font-display); font-weight: 800; float: left; font-size: 3.6em; line-height: 0.85;
  padding: 0.08em 0.12em 0 0; color: var(--ink);
}
.prose h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; line-height: 1.2; margin-top: 2.2em; letter-spacing: -0.005em; }
.prose h3 { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; margin-top: 1.8em; }
.prose ul, .prose ol { padding-left: 1.3em; }
.prose li + li { margin-top: 0.45em; }
.prose ul li::marker { color: var(--muted); }
.prose ol li::marker { font-family: var(--font-mono); font-size: 0.85em; color: var(--muted); }
.prose strong { font-weight: 700; }
.prose blockquote { margin-inline: 0; padding-left: 1.2rem; border-left: 4px solid var(--ink); font-style: italic; }
.callout { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem 1.2rem 1.1rem; display: flex; flex-direction: column; gap: 0.4rem; position: relative; overflow: hidden; }
.callout::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 6px; background: repeating-linear-gradient(-45deg, var(--accent) 0 8px, var(--ink) 8px 16px); }
.callout--warn::before { background: repeating-linear-gradient(-45deg, var(--red) 0 8px, var(--surface) 8px 16px); }
.callout--fact::before { background: var(--ink); }
.callout p { padding-left: 0.6rem; }
.callout__label { font-family: var(--font-mono); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.prose table { border-collapse: collapse; width: 100%; font-size: 0.95rem; line-height: 1.45; }
.prose th, .prose td { text-align: left; padding: 0.65rem 0.85rem; border-bottom: 1px solid var(--line); vertical-align: top; }
.prose th { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: color-mix(in srgb, var(--bg) 60%, var(--surface)); }
.prose tr:last-child td { border-bottom: 0; }
.prose td { font-variant-numeric: tabular-nums; }
.tags { display: flex; flex-wrap: wrap; gap: 0.5rem; padding-top: 1.5rem; border-top: 1px solid var(--line); margin-top: 2.5rem !important; }
.tag { font-family: var(--font-mono); font-size: var(--step--1); color: var(--muted); }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 3rem; }
.pager__link { display: flex; flex-direction: column; gap: 0.35rem; padding: 1rem 1.2rem; border: 1px solid var(--line); border-radius: var(--radius); text-decoration: none; background: var(--surface); min-width: 0; }
.pager__link:hover { border-color: var(--ink); }
.pager__link--next { text-align: right; }
.pager__title { font-family: var(--font-display); font-weight: 600; font-size: 0.98rem; line-height: 1.3; }
.related { padding-bottom: 1rem; }

/* ---------- category / archive / about ---------- */
.pagehead { padding-block: 2.5rem 2rem; display: flex; flex-direction: column; gap: 0.8rem; }
.pagehead__title { font-family: var(--font-display); font-weight: 800; font-size: var(--step-4); line-height: 1.05; letter-spacing: -0.015em; }
.pagehead__blurb { font-size: var(--step-1); color: var(--muted); max-width: 52ch; }
.finder { display: flex; flex-direction: column; gap: 0.75rem; padding: 1.2rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 1.5rem; }
.finder__input {
  font: 500 1.1rem var(--font-body); padding: 0.75rem 0.9rem; border-radius: var(--radius);
  border: 2px solid var(--ink); background: var(--bg); color: var(--ink); width: 100%;
}
.filters { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.filter {
  font: 600 0.75rem var(--font-display); letter-spacing: 0.04em; text-transform: uppercase;
  padding: 0.45rem 0.7rem; border-radius: 3px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer;
}
.filter[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.finder__count { color: var(--muted); }
.rows { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
.row { display: grid; grid-template-columns: 5.5rem minmax(0, 1fr) auto 6.5rem; gap: 1rem; align-items: center; padding: 0.85rem 0.25rem; border-bottom: 1px solid var(--line); }
.row__no, .row__date { color: var(--muted); }
.row__date { text-align: right; }
.row__title { font-family: var(--font-display); font-weight: 500; font-size: 0.98rem; line-height: 1.35; text-decoration: none; }
.row__title:hover { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 3px; }
.empty { padding: 2rem 0; color: var(--muted); }
.narrow .spec { margin-block: 1rem; }

/* ---------- footer ---------- */
.footer { margin-top: 5rem; background: var(--ink); color: var(--bg); padding-block: 3rem 2rem; }
.footer .label { color: color-mix(in srgb, var(--bg) 65%, var(--ink)); margin-bottom: 0.75rem; }
.footer a { color: var(--bg); }
.footer :focus-visible { outline-color: var(--accent); }
.footer__grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 2rem; }
.footer__text { color: color-mix(in srgb, var(--bg) 78%, var(--ink)); font-size: 0.95rem; max-width: 40ch; }
.footer__list { list-style: none; padding: 0; margin: 0; columns: 2; font-size: 0.95rem; }
.footer__list li { margin-bottom: 0.35rem; break-inside: avoid; }
.footer__list .mono { color: color-mix(in srgb, var(--bg) 60%, var(--ink)); }
.odometer { display: inline-flex; gap: 3px; margin-bottom: 0.75rem; }
.odometer span { background: var(--bg); color: var(--ink); font-size: 1.5rem; font-weight: 700; padding: 0.15rem 0.4rem; border-radius: 3px; }
.odometer span:last-child { background: var(--accent); color: var(--on-accent); }
.footer__fine { margin-top: 2.5rem; padding-top: 1.25rem; border-top: 1px solid color-mix(in srgb, var(--bg) 25%, var(--ink)); font-size: 0.8rem; color: color-mix(in srgb, var(--bg) 60%, var(--ink)); }

/* ---------- responsive ---------- */
@media (max-width: 1080px) {
  .grid--4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .post__layout { grid-template-columns: minmax(0, 1fr); }
  .post__side { position: static; }
  .post__side .spec { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .toc { display: none; }
}
@media (max-width: 860px) {
  .lead { grid-template-columns: minmax(0, 1fr); }
  .grid--3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .footer__grid { grid-template-columns: 1fr; }
  .row { grid-template-columns: minmax(0, 1fr) auto; gap: 0.35rem 0.75rem; }
  .row__no { grid-column: 1; grid-row: 1; }
  .row__date { grid-column: 2; grid-row: 1; }
  .row__title { grid-column: 1 / -1; grid-row: 2; }
  .row__cat { grid-column: 1 / -1; grid-row: 3; }
}
@media (max-width: 560px) {
  .grid--3, .grid--4 { grid-template-columns: minmax(0, 1fr); }
  .card--compact { flex-direction: row; align-items: flex-start; }
  .card--compact .card__media { flex: 0 0 38%; }
  .card--compact .card__body { min-width: 0; }
  .pager { grid-template-columns: minmax(0, 1fr); }
  .pager__link--next { text-align: left; }
  .post__cover svg { aspect-ratio: 16 / 10; }
  .wordmark__rpm { display: none; }
  .prose { font-size: 1.06rem; }
  .post__side .spec { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px), (max-height: 520px) {
  .masthead { position: static; }
  .revbar--progress { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; z-index: 30; margin: 0; padding: 4px var(--gutter); height: 13px; background: var(--bg); max-width: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}

  const CATEGORIES = [
    { id: 'history', name: 'История', blurb: 'Модели и люди, которые изменили автомобиль.', bg: '#5E4128', ink: '#F2D7AE' },
    { id: 'tech', name: 'Устройство', blurb: 'Как работают узлы и системы, без лишних формул.', bg: '#21405A', ink: '#BFD9EE' },
    { id: 'electric', name: 'Электро', blurb: 'Электромобили, гибриды, батареи и зарядка.', bg: '#1C5548', ink: '#B9EBD9' },
    { id: 'service', name: 'Обслуживание', blurb: 'Масло, шины, тормоза и всё, что продлевает жизнь машине.', bg: '#434950', ink: '#D9DEE3' },
    { id: 'driving', name: 'Вождение', blurb: 'Навыки и привычки, которые делают поездки безопаснее.', bg: '#3A4626', ink: '#DCE8B8' },
    { id: 'buying', name: 'Покупка', blurb: 'Выбор, проверка, деньги и продажа автомобиля.', bg: '#542B41', ink: '#F0C9DC' },
    { id: 'motorsport', name: 'Автоспорт', blurb: 'Гонки, трассы и люди, которые ездят на пределе.', bg: '#6E1D18', ink: '#FFD0C4' },
    { id: 'culture', name: 'Культура', blurb: 'Дизайн, кино, коллекции и великие дороги.', bg: '#34306A', ink: '#D4D0FF' },
  ];
  const CAT = Object.fromEntries(CATEGORIES.map((c) => [c.id, c]));

  const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];

  // ---------- small utils ----------
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function hash(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function rng(seed) {
    let s = seed || 1;
    return () => { s = Math.imul(s ^ (s >>> 15), 2246822519) ^ Math.imul(s ^ (s >>> 13), 3266489917); s ^= s >>> 16; return (s >>> 0) / 4294967296; };
  }
  function fmtDate(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    return `${d} ${MONTHS[m - 1]} ${y}`;
  }
  function pad3(n) { return String(n).padStart(3, '0'); }
  function plural(n, one, few, many) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
    return many;
  }

  // ---------- frontmatter + markdown ----------
  function parseArticle(src) {
    const m = src.replace(/\r\n/g, '\n').match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
    if (!m) throw new Error('missing frontmatter');
    const meta = { facts: [], tags: [] };
    let inFacts = false;
    for (const line of m[1].split('\n')) {
      if (inFacts && /^\s*-\s+/.test(line)) {
        const [label, ...rest] = line.replace(/^\s*-\s+/, '').split('|');
        if (rest.length) meta.facts.push({ label: label.trim().replace(/^(["'])(.*)\1$/, '$2'), value: rest.join('|').trim().replace(/^(["'])(.*)\1$/, '$2') });
        continue;
      }
      const kv = line.match(/^([a-zA-Z]+):\s*(.*)$/);
      if (!kv) continue;
      inFacts = kv[1] === 'facts';
      if (inFacts) continue;
      const v = kv[2].trim().replace(/^(["'])(.*)\1$/, '$2');
      if (kv[1] === 'tags') {
        meta.tags = v.replace(/^\[|\]$/g, '').split(',').map((t) => t.trim().replace(/^(["'])(.*)\1$/, '$2')).filter(Boolean);
      } else meta[kv[1]] = v;
    }
    const body = m[2].trim();
    const words = (body.replace(/[#>*|\-]/g, ' ').match(/[\p{L}\p{N}]+/gu) || []).length;
    return Object.assign(meta, { body, words, minutes: Math.max(1, Math.round(words / 180)) });
  }

  function inline(s) {
    const codes = [];
    return esc(s)
      .replace(/`([^`]+)`/g, (_, c) => '\u0000' + (codes.push(c) - 1) + '\u0000')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g, '$1<em>$2</em>')
      .replace(/\u0000(\d+)\u0000/g, (_, i) => '<code>' + codes[i] + '</code>');
  }

  // Markdown subset: ##/### headings, paragraphs, - and 1. lists, > callouts, pipe tables.
  function renderMarkdown(md) {
    const lines = md.split('\n');
    const out = [];
    const toc = [];
    let i = 0;
    const isBlockStart = (l) => /^(#{1,4}\s|[-*]\s|\d+[.)]\s|>|\|)/.test(l);
    while (i < lines.length) {
      const line = lines[i];
      if (!line.trim()) { i++; continue; }
      let h;
      if ((h = line.match(/^(#{1,4})\s+(.*)$/))) {
        const level = Math.max(2, Math.min(h[1].length, 3));
        const text = h[2].trim();
        if (level === 2) {
          const id = 'sec-' + (toc.length + 1);
          toc.push({ id, text });
          out.push(`<h2 id="${id}">${inline(text)}</h2>`);
        } else out.push(`<h3>${inline(text)}</h3>`);
        i++;
      } else if (/^>/.test(line)) {
        const buf = [];
        while (i < lines.length && /^>/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, '')); i++; }
        const text = buf.join(' ').trim();
        const lab = text.match(/^\*\*([^*]+?):?\*\*:?\s*/);
        if (lab) {
          const kind = /важно/i.test(lab[1]) ? 'warn' : /факт/i.test(lab[1]) ? 'fact' : 'tip';
          out.push(`<aside class="callout callout--${kind}"><p class="callout__label">${esc(lab[1].replace(/:$/, ''))}</p><p>${inline(text.slice(lab[0].length))}</p></aside>`);
        } else out.push(`<blockquote><p>${inline(text)}</p></blockquote>`);
      } else if (/^\|/.test(line)) {
        const rows = [];
        while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i]); i++; }
        const cells = (r) => r.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
        const body = rows.filter((r, k) => !(k === 1 && /^\|?[\s:|-]+\|?$/.test(r)));
        const head = cells(body[0]);
        const trs = body.slice(1).map((r) => '<tr>' + cells(r).map((c) => `<td>${inline(c)}</td>`).join('') + '</tr>').join('');
        out.push(`<div class="table-wrap" tabindex="0" role="region" aria-label="${esc('Таблица: ' + head.join(', ').replace(/\*/g, ''))}"><table><thead><tr>${head.map((c) => `<th scope="col">${inline(c)}</th>`).join('')}</tr></thead><tbody>${trs}</tbody></table></div>`);
      } else if (/^[-*]\s/.test(line) || /^\d+[.)]\s/.test(line)) {
        const ordered = /^\d/.test(line);
        const re = ordered ? /^\d+[.)]\s+/ : /^[-*]\s+/;
        const items = [];
        while (i < lines.length && (re.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
          if (re.test(lines[i])) items.push(lines[i].replace(re, ''));
          else items[items.length - 1] += ' ' + lines[i].trim();
          i++;
        }
        const tag = ordered ? 'ol' : 'ul';
        out.push(`<${tag}>${items.map((t) => `<li>${inline(t)}</li>`).join('')}</${tag}>`);
      } else {
        const buf = [];
        while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) { buf.push(lines[i].trim()); i++; }
        if (!buf.length) { buf.push(line.trim()); i++; }
        out.push(`<p>${inline(buf.join(' '))}</p>`);
      }
    }
    return { html: out.join('\n'), toc };
  }

  // ---------- generative covers ----------
  // Every cover is drawn from the article slug: same input, same picture.
  function cover(a) {
    const c = CAT[a.category] || CATEGORIES[0];
    const W = 1200, H = 750;
    const r = rng(hash(a.slug));
    const ink = c.ink, bg = c.bg, hi = '#FFC21A';
    const sw = (n) => `stroke-width="${n}"`;
    let g = '';
    switch (a.category) {
      case 'history': { // sunburst + enamel badge rings
        const cx = 300 + r() * 600, cy = 300 + r() * 250, n = 36;
        for (let k = 0; k < n; k++) {
          const t = (k / n) * Math.PI * 2, x = cx + Math.cos(t) * 1600, y = cy + Math.sin(t) * 1600;
          g += `<line x1="${cx | 0}" y1="${cy | 0}" x2="${x | 0}" y2="${y | 0}" stroke="${ink}" opacity="${k % 2 ? 0.08 : 0.18}" ${sw(k % 2 ? 6 : 14)}/>`;
        }
        for (let k = 0; k < 4; k++) g += `<circle cx="${cx | 0}" cy="${cy | 0}" r="${110 + k * 46}" fill="none" stroke="${k === 1 ? hi : ink}" ${sw(k === 1 ? 10 : 3)} opacity="${k === 1 ? 0.9 : 0.55}"/>`;
        g += `<circle cx="${cx | 0}" cy="${cy | 0}" r="72" fill="${ink}" opacity="0.9"/>`;
        break;
      }
      case 'tech': { // meshing gears
        let x = 120 + r() * 200, y = 200 + r() * 300;
        for (let k = 0; k < 5; k++) {
          const R = 70 + r() * 150, teeth = 10 + ((r() * 14) | 0);
          let d = '';
          for (let t = 0; t <= teeth * 2; t++) {
            const ang = (t / (teeth * 2)) * Math.PI * 2, rr = t % 2 ? R : R * 0.86;
            d += (t ? 'L' : 'M') + (x + Math.cos(ang) * rr).toFixed(1) + ' ' + (y + Math.sin(ang) * rr).toFixed(1);
          }
          g += `<path d="${d}Z" fill="none" stroke="${k === 2 ? hi : ink}" ${sw(k === 2 ? 8 : 4)} opacity="${k === 2 ? 0.95 : 0.6}"/>`;
          g += `<circle cx="${x | 0}" cy="${y | 0}" r="${(R * 0.25) | 0}" fill="none" stroke="${ink}" ${sw(3)} opacity="0.5"/>`;
          x += R * 1.5 + 40; y = Math.max(120, Math.min(H - 120, y + (r() - 0.5) * 260));
          if (x > W + 100) break;
        }
        break;
      }
      case 'electric': { // battery cells with charge level + bolt
        const cols = 8, rows = 4, cw = 118, ch = 120, ox = 70, oy = 110;
        const level = 0.25 + r() * 0.7;
        for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
          const filled = (x + 1) / cols <= level;
          g += `<rect x="${ox + x * (cw + 14)}" y="${oy + y * (ch + 14)}" width="${cw}" height="${ch}" rx="10" fill="${filled ? ink : 'none'}" opacity="${filled ? (0.22 + 0.06 * y).toFixed(2) : 0.5}" stroke="${ink}" ${sw(3)}/>`;
        }
        const bx = (520 + r() * 160) | 0;
        g += `<path d="M${bx} 60 L${bx - 150} 420 L${bx - 20} 420 L${bx - 90} 700 L${bx + 170} 300 L${bx + 30} 300 L${bx + 110} 60 Z" fill="${hi}" opacity="0.95"/>`;
        break;
      }
      case 'service': { // hex nuts
        const s = 74 + r() * 30;
        for (let y = 0, row = 0; y < H + s; y += s * 1.6, row++) for (let x = row % 2 ? s : 0; x < W + s; x += s * 2) {
          let d = '';
          for (let k = 0; k < 6; k++) { const t = Math.PI / 6 + (k * Math.PI) / 3; d += (k ? 'L' : 'M') + (x + Math.cos(t) * s * 0.8).toFixed(0) + ' ' + (y + Math.sin(t) * s * 0.8).toFixed(0); }
          const lit = r() < 0.08;
          g += `<path d="${d}Z" fill="none" stroke="${lit ? hi : ink}" ${sw(lit ? 8 : 3)} opacity="${lit ? 1 : 0.45}"/><circle cx="${x | 0}" cy="${y | 0}" r="${(s * 0.32) | 0}" fill="none" stroke="${ink}" ${sw(3)} opacity="0.35"/>`;
        }
        break;
      }
      case 'driving': { // perspective road with dashed centre line
        const vx = (400 + r() * 400) | 0, vy = (210 + r() * 80) | 0;
        g += `<path d="M${vx - 6} ${vy} L${vx + 6} ${vy} L${W + 220} ${H} L${-220} ${H} Z" fill="${ink}" opacity="0.14"/>`;
        g += `<line x1="${vx - 6}" y1="${vy}" x2="${-220}" y2="${H}" stroke="${ink}" ${sw(8)} opacity="0.8"/><line x1="${vx + 6}" y1="${vy}" x2="${W + 220}" y2="${H}" stroke="${ink}" ${sw(8)} opacity="0.8"/>`;
        for (let k = 0; k < 9; k++) {
          const t0 = Math.pow(k / 9, 2), t1 = Math.pow((k + 0.5) / 9, 2);
          const y0 = (vy + (H - vy) * t0).toFixed(0), y1 = (vy + (H - vy) * t1).toFixed(0);
          const w0 = (2 + 26 * t0).toFixed(1), w1 = (2 + 26 * t1).toFixed(1);
          g += `<path d="M${vx - w0} ${y0} L${vx + +w0} ${y0} L${vx + +w1} ${y1} L${vx - w1} ${y1} Z" fill="${hi}"/>`;
        }
        for (let k = 0; k < 5; k++) g += `<line x1="0" y1="${vy - 30 - k * 26}" x2="${W}" y2="${vy - 30 - k * 26}" stroke="${ink}" ${sw(2)} opacity="${(0.25 - k * 0.04).toFixed(2)}"/>`;
        break;
      }
      case 'buying': { // number plates + price stripes
        for (let k = -6; k < 14; k++) g += `<line x1="${k * 120}" y1="${H}" x2="${k * 120 + 700}" y2="0" stroke="${ink}" ${sw(26)} opacity="0.07"/>`;
        for (let k = 0; k < 3; k++) {
          const x = (140 + k * 70 + r() * 40) | 0, y = 140 + k * 150;
          g += `<rect x="${x}" y="${y}" width="760" height="170" rx="18" fill="${k === 2 ? ink : 'none'}" opacity="${k === 2 ? 0.92 : 0.6}" stroke="${ink}" ${sw(6)}/>`;
          if (k === 2) {
            g += `<rect x="${x + 640}" y="${y + 20}" width="3" height="130" fill="${bg}"/>`;
            for (let j = 0; j < 6; j++) g += `<rect x="${x + 50 + j * 92}" y="${y + 45}" width="64" height="80" rx="8" fill="${bg}" opacity="${(0.85 - (j % 2) * 0.25).toFixed(2)}"/>`;
            g += `<circle cx="${x + 700}" cy="${y + 85}" r="26" fill="${hi}"/>`;
          }
        }
        break;
      }
      case 'motorsport': { // waving chequered flag + speed lines
        const size = 70, skew = -0.35 + r() * 0.2;
        let d = '';
        for (let y = 0; y < 7; y++) for (let x = 0; x < 9; x++) if ((x + y) % 2 === 0) {
          const px = 520 + x * size + y * size * skew, py = 120 + y * size + Math.sin(x * 0.7) * 22;
          d += `M${px.toFixed(0)} ${py.toFixed(0)}h${size}v${size}h-${size}Z`;
        }
        g += `<path d="${d}" fill="${ink}" opacity="0.85"/>`;
        for (let k = 0; k < 9; k++) { const y = (120 + k * 60 + r() * 20) | 0; g += `<line x1="${(40 + r() * 80) | 0}" y1="${y}" x2="${(420 + r() * 140) | 0}" y2="${y}" stroke="${k === 4 ? hi : ink}" ${sw(k === 4 ? 12 : 5)} stroke-linecap="round" opacity="${k === 4 ? 1 : 0.5}"/>`; }
        break;
      }
      default: { // culture: French-curve sweeps
        for (let k = 0; k < 7; k++) {
          const y = 120 + k * 85 + r() * 40;
          g += `<path d="M-50 ${y | 0} C ${(300 + r() * 200) | 0} ${(y - 260 + r() * 140) | 0}, ${(700 + r() * 200) | 0} ${(y + 260 - r() * 140) | 0}, ${W + 50} ${(y - 40) | 0}" fill="none" stroke="${k === 3 ? hi : ink}" ${sw(k === 3 ? 12 : 4)} opacity="${k === 3 ? 1 : 0.55}"/>`;
        }
        g += `<circle cx="${(820 + r() * 200) | 0}" cy="${(180 + r() * 100) | 0}" r="${(70 + r() * 40) | 0}" fill="${ink}" opacity="0.85"/>`;
      }
    }
    const no = a.no ? `<text x="${W - 48}" y="${H - 44}" text-anchor="end" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="40" font-weight="600" fill="${ink}">№ ${pad3(a.no)}</text>` : '';
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${esc('Обложка статьи, рубрика «' + c.name + '»')}" xmlns="http://www.w3.org/2000/svg"><rect width="${W}" height="${H}" fill="${bg}"/>${g}${no}</svg>`;
  }

  // ---------- templates ----------
  // `L` resolves links: {home, archive, about, article(slug), category(id), themeToggle}
  function revbar(progress) {
    let s = '';
    for (let k = 0; k < 24; k++) s += `<i class="${k >= 20 ? 'red' : k >= 16 ? 'amber' : ''}"></i>`;
    return `<div class="revbar${progress ? ' revbar--progress' : ''}" aria-hidden="true">${s}</div>`;
  }

  function header(L, active) {
    const nav = CATEGORIES.map((c) => `<a href="${L.category(c.id)}"${active === c.id ? ' aria-current="page"' : ''}>${esc(c.name)}</a>`).join('');
    return `<a class="skip" href="#main">Перейти к содержанию</a>
<header class="masthead">
  <div class="masthead__row wrap">
    <a class="wordmark" href="${L.home}" aria-label="${SITE.name}: на главную">ОТСЕЧКА<span class="wordmark__rpm" aria-hidden="true">×1000 об/мин</span></a>
    <div class="masthead__tools">
      <a class="tool" href="${L.archive}"${active === 'archive' ? ' aria-current="page"' : ''}>Все статьи</a>
      <a class="tool" href="${L.about}"${active === 'about' ? ' aria-current="page"' : ''}>О журнале</a>
      ${L.themeToggle ? '<button class="tool tool--theme" type="button" id="theme-toggle">Тема</button>' : ''}
    </div>
  </div>
  <nav class="catnav wrap" aria-label="Рубрики">${nav}</nav>
  ${revbar(active === 'article')}
</header>`;
  }

  function footer(L, articles) {
    const counts = CATEGORIES.map((c) => `<li><a href="${L.category(c.id)}">${esc(c.name)}</a> <span class="mono">${articles.filter((a) => a.category === c.id).length}</span></li>`).join('');
    const words = articles.reduce((s, a) => s + a.words, 0);
    return `<footer class="footer">
  <div class="wrap footer__grid">
    <div>
      <p class="wordmark wordmark--small">ОТСЕЧКА</p>
      <p class="footer__text">${esc(SITE.tagline)}. Пишем о машинах так, чтобы было понятно с первого раза и интересно до последнего абзаца.</p>
    </div>
    <div>
      <p class="label">Рубрики</p>
      <ul class="footer__list">${counts}</ul>
    </div>
    <div>
      <p class="label">Одометр журнала</p>
      <p class="odometer mono" role="img" aria-label="${articles.length} статей">${String(articles.length).padStart(6, '0').split('').map((d) => `<span>${d}</span>`).join('')}</p>
      <p class="footer__text">${articles.length} ${plural(articles.length, 'статья', 'статьи', 'статей')} · ${CATEGORIES.length} рубрик · ≈${Math.round(words / 1000)} тыс. слов</p>
    </div>
  </div>
  <p class="wrap footer__fine">© 2026 «Отсечка». Тексты носят информационный характер: при ремонте и обслуживании сверяйтесь с руководством по эксплуатации своего автомобиля.</p>
</footer>`;
  }

  function chip(L, a) {
    const c = CAT[a.category];
    return `<a class="chip chip--${c.id}" href="${L.category(c.id)}">${esc(c.name)}</a>`;
  }

  // Static build links cover files (L.cover); the single-file build draws them inline.
  function media(L, a, eager) {
    return L.cover ? `<img src="${L.cover(a.slug)}" width="1200" height="750" alt="" ${eager ? 'fetchpriority="high"' : 'loading="lazy"'} decoding="async">` : cover(a);
  }

  function card(L, a, compact, level) {
    const h = level || 3;
    return `<article class="card${compact ? ' card--compact' : ''}">
  <a class="card__media" href="${L.article(a.slug)}" tabindex="-1" aria-hidden="true">${media(L, a)}</a>
  <div class="card__body">
    <p class="meta">${chip(L, a)}<span class="mono">${a.minutes} мин</span></p>
    <h${h} class="card__title"><a href="${L.article(a.slug)}">${esc(a.title)}</a></h${h}>
    ${compact ? '' : `<p class="card__excerpt">${esc(a.excerpt)}</p>`}
  </div>
</article>`;
  }

  function specSheet(a, small) {
    if (!a.facts || !a.facts.length) return '';
    return `<dl class="spec${small ? ' spec--small' : ''}">${a.facts.slice(0, 4).map((f) => `<div><dt>${esc(f.label)}</dt><dd>${esc(f.value)}</dd></div>`).join('')}</dl>`;
  }

  function home(L, articles) {
    const [lead, ...rest] = articles;
    const fresh = rest.slice(0, 6);
    const shown = new Set([lead, ...fresh].map((a) => a.slug));
    const sections = CATEGORIES.map((c) => {
      const list = articles.filter((a) => a.category === c.id);
      const pick = list.filter((a) => !shown.has(a.slug)).slice(0, 4);
      return `<section class="shelf" aria-labelledby="shelf-${c.id}">
  <div class="shelf__head">
    <h2 id="shelf-${c.id}" class="shelf__title"><span class="swatch swatch--${c.id}" aria-hidden="true"></span>${esc(c.name)}</h2>
    <p class="shelf__blurb">${esc(c.blurb)}</p>
    <a class="more" href="${L.category(c.id)}">Все ${list.length} ${plural(list.length, 'статья', 'статьи', 'статей')} →</a>
  </div>
  <div class="grid grid--4">${pick.map((a) => card(L, a, true)).join('')}</div>
</section>`;
    }).join('');
    return `<main id="main" class="wrap">
  <h1 class="visually-hidden">${SITE.name} — журнал об автомобилях</h1>
  <section class="lead" aria-label="Главная статья">
    <a class="lead__media" href="${L.article(lead.slug)}" tabindex="-1" aria-hidden="true">${media(L, lead, true)}</a>
    <div class="lead__body">
      <p class="eyebrow">Свежий выпуск · ${fmtDate(lead.date)}</p>
      <h2 class="lead__title"><a href="${L.article(lead.slug)}">${esc(lead.title)}</a></h2>

  function articlePage(L, a, articles) {

    const related = same.filter((x) => x.slug !== a.slug)
      .sort((x, y) => (hash(a.slug + x.slug) % 97) - (hash(a.slug + y.slug) % 97)).slice(0, 3);
    const toc = r.toc.length > 2 ? `<nav class="toc" aria-label="Содержание"><p class="label">Содержание</p><ol>${r.toc.map((t) => `<li><a href="#${t.id}" data-toc="${t.id}">${inline(t.text)}</a></li>`).join('')}</ol></nav>` : '';
    return `<main id="main">

${r.html}
        <p class="tags">${a.tags.map((t) => `<span class="tag">#${esc(t)}</span>`).join('')}</p>

  function categoryPage(L, c, articles) {

    const filters = ['<button type="button" class="filter" data-filter="" aria-pressed="true">Все</button>']
      .concat(CATEGORIES.map((c) => `<button type="button" class="filter" data-filter="${c.id}" aria-pressed="false">${esc(c.name)}</button>`)).join('');
    return `<main id="main" class="wrap">

    <p class="pagehead__blurb">Ищите по названию, описанию или тегу. Номер у каждой статьи постоянный, по нему её легко найти снова.</p>

  <div class="finder" role="search">

    <p>Отсечка — момент, когда электроника ограничивает обороты, чтобы двигатель не вышел за безопасный предел. Стрелка тахометра упирается в красную зону, и мотор отдаёт всё, что может, но не больше. Нам нравится эта идея: говорить о машинах увлечённо, но по делу.</p>
    <p>Здесь собраны ${articles.length} статей в восьми рубриках: от первого автомобиля Карла Бенца до электромобилей, от замены масла до «Дакара». Тексты рассчитаны на тех, кто любит машины, но не обязан быть инженером: каждое понятие объясняется, каждый совет можно применить.</p>
    <h2>Как читать журнал</h2>

    <aside class="callout callout--warn"><p class="callout__label">Важно</p><p>Статьи об обслуживании и ремонте дают общее понимание. Конкретные интервалы, допуски и моменты затяжки всегда сверяйте с руководством по эксплуатации своей машины.</p></aside>

</main>`;
  }

  // Newest first; numbers follow publication order and never change.
  function prepare(list) {
    const byDate = list.slice().sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.slug < b.slug ? -1 : 1));
    byDate.forEach((a, i) => { a.no = i + 1; });
    return byDate.reverse();
  }

  const api = { SITE, CATEGORIES, CAT, esc, fmtDate, parseArticle, renderMarkdown, cover, header, footer, home, articlePage, categoryPage, archivePage, aboutPage, notFound, prepare, plural };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.Site = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
/* «Отсечка» — browser behaviour shared by the static site and the single-file build. */
(function () {
  'use strict';

  function store(key, value) {
    try {
      if (value === undefined) return localStorage.getItem(key);
      if (value === null) localStorage.removeItem(key); else localStorage.setItem(key, value);
    } catch (e) { /* storage blocked: the page works without it */ }
    return null;
  }

  // ---- theme toggle (static site only; the artifact follows the viewer's theme) ----
  function isDark() {
    const t = document.documentElement.dataset.theme;
    return t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function initTheme() {
    const btn = document.getElementById('theme-toggle');
    if (!btn || btn.dataset.bound) return;
    btn.dataset.bound = '1';
    const label = () => { btn.textContent = isDark() ? 'Светлая тема' : 'Тёмная тема'; };
    label();
    btn.addEventListener('click', () => {
      document.documentElement.dataset.theme = isDark() ? 'light' : 'dark';
      store('otsechka-theme', document.documentElement.dataset.theme);
      label();
    });
  }

  // ---- rev bar reading progress + active TOC entry ----
  let ticking = false;
  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      ticking = false;
      const bar = document.querySelector('.revbar--progress');
      const prose = document.querySelector('.post .prose');
      if (!bar || !prose) return;
      const rect = prose.getBoundingClientRect();
      const total = rect.height - window.innerHeight * 0.6;
      const p = Math.min(1, Math.max(0, (-rect.top + window.innerHeight * 0.25) / Math.max(1, total)));
      const segs = bar.children, lit = Math.round(p * segs.length);
      for (let i = 0; i < segs.length; i++) segs[i].classList.toggle('on', i < lit);
      const links = document.querySelectorAll('.toc a[data-toc]');
      let current = null;
      links.forEach((a) => {
        const h = document.getElementById(a.dataset.toc);
        if (h && h.getBoundingClientRect().top < window.innerHeight * 0.3) current = a;
      });
      links.forEach((a) => a.classList.toggle('active', a === current));
    });
  }

  // ---- archive search + category filter ----
  function initArchive() {
    const q = document.getElementById('q');
    const rows = document.querySelectorAll('#rows .row');
    if (!q || !rows.length) return;
    const buttons = document.querySelectorAll('.filter');
    const count = document.getElementById('count');
    const empty = document.getElementById('empty');
    let cat = '';
    function apply() {
      const words = q.value.toLowerCase().replace(/ё/g, 'е').split(/\s+/).filter(Boolean);
      let n = 0;
      rows.forEach((r) => {
        const hay = r.dataset.q.replace(/ё/g, 'е');
        const ok = (!cat || r.dataset.cat === cat) && words.every((w) => hay.includes(w));
        r.hidden = !ok;
        if (ok) n++;
      });
      count.textContent = 'Найдено: ' + n;
      empty.hidden = n > 0;
    }
    let timer;
    q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(apply, 250); });
    buttons.forEach((b) => b.addEventListener('click', () => {
      cat = b.dataset.filter;
      buttons.forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      apply();
    }));
    apply();
  }

  function init() {
    initTheme();
    initArchive();
    onScroll();
  }

  // In the single-file build the hash holds the route, so in-page anchors scroll without touching it.
  if (window.OTSECHKA_SPA) {
    document.addEventListener('click', (e) => {
      const a = e.target.closest && e.target.closest('a[href^="#sec-"], a[href="#main"]');
      if (!a) return;
      const el = document.getElementById(a.getAttribute('href').slice(1));
      if (!el) return;
      e.preventDefault();
      el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
      if (a.getAttribute('href') === '#main') { el.setAttribute('tabindex', '-1'); el.focus({ preventScroll: true }); }
    });
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  window.Otsechka = { init: init };
  if (!window.OTSECHKA_SPA) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
  }
})();

</script>
<script>
(function () {
  var ARTICLES = [{"title":"Великие дороги мира: маршруты для автопутешествий","slug":"road-trip-routes","category":"culture","date":"2026-10-02","excerpt":"Шоссе 66, Трансфагарашское шоссе, Атлантическая дорога Норвегии, перевал Стельвио и Чуйский тракт — выбираем дороги, ради которых стоит взять отпуск и сесть за руль.","tags":["путешествия","маршруты","дороги","автотуризм"],"facts":[{"label":"Шоссе 66","value":"≈3900 км"},{"label":"Великая океанская дорога","value":"≈240 км"},{"label":"Перевал Стельвио","value":"2757 м"},{"label":"Атлантическая дорога","value":"≈8 км"}],"body":"Есть дороги, которые просто ведут из пункта А в пункт Б, и есть дороги, ради которых пункт Б вообще не нужен. Они вьются по горным склонам, повисают над океаном, пересекают пустыни и становятся героями фильмов и песен. Мы собрали маршруты, которые автопутешественники всего мира называют обязательными, — от американской классики до сибирских перевалов.\n\n## Американская классика\n\n### Шоссе 66, США\n\nЗнаменитая «Мать дорог» открылась в 1926 году и связала Чикаго с Санта-Моникой на тихоокеанском побережье. Протяжённость маршрута — около 3900 километров через восемь штатов: Иллинойс, Миссури, Канзас, Оклахома, Техас, Нью-Мексико, Аризона и Калифорния. По шоссе 66 ехали на запад переселенцы из засушливых районов в годы Великой депрессии — именно об этом пишет Джон Стейнбек в «Гроздьях гнева».\n\nВ 1985 году трассу официально исключили из федеральной системы: её заменили современные автомагистрали. Но значительная часть старой дороги сохранилась и превратилась в музей под открытым небом — с неоновыми мотелями, придорожными закусочными, заправками в стиле 1950-х и бесконечными пустынными горизонтами.\n\n### Шоссе 1, Калифорния\n\nТихоокеанское шоссе, или Highway 1, тянется вдоль калифорнийского побережья. Самый знаменитый отрезок — Биг-Сур между Монтереем и Сан-Луис-Обиспо: дорога врезана в скалы, справа обрыв к океану, слева горы, а на каждом повороте — новая открытка. Мост Биксби-Крик с его высокой бетонной аркой узнают по сотням фильмов и рекламных роликов.\n\nУчтите: участки Биг-Сура время от времени закрывают из-за оползней, поэтому перед поездкой обязательно проверяйте актуальную обстановку.\n\n## Великая океанская дорога, Австралия\n\nОколо 240 километров вдоль южного побережья штата Виктория. Дорогу строили в 1919–1932 годах вернувшиеся с Первой мировой войны солдаты, и она считается крупнейшим в мире военным мемориалом. Главная достопримечательность — «Двенадцать апостолов», известняковые столбы, торчащие из океана. Апостолов, впрочем, никогда не было ровно двенадцать, а волны продолжают их разрушать.\n\nАвстралия интересна и тем, что здесь левостороннее движение. Даже если вы ездили на праворульной японской машине, к движению по левой стороне придётся привыкать: первые часы за рулём требуют внимания, особенно на перекрёстках и кольцевых развязках. Многие путешественники проезжают Великую океанскую дорогу за один длинный день, но правильнее заложить два-три дня с ночёвками в прибрежных городках: так вы увидите побережье и на закате, и в утреннем тумане, а не только из окна.\n\n## Европейские серпантины\n\n### Трансфагарашское шоссе, Румыния\n\nДорогу через Фэгэрашские горы построили в первой половине 1970-х годов по военным соображениям. Высшая точка — около 2000 метров у ледникового озера Балеа. Серпантины северного склона выглядят с высоты как брошенная на склон лента. Шоссе открыто только в тёплое время года, обычно с начала лета до осени.\n\n### Перевал Стельвио, Италия\n\nОдин из самых высоких автомобильных перевалов Альп — 2757 метров. На восточном склоне около полусотни пронумерованных шпилек, и каждая требует аккуратной работы рулём и тормозами. Перевал любим мотоциклистами и велосипедистами, поэтому летом здесь бывает тесно.\n\n### Атлантическая дорога, Норвегия\n\nВсего около восьми километров, но каждый из них — шедевр. Дорога прыгает с острова на остров по невысоким мостам над морем, а самый известный из них, Сторсейсундет, с определённого ракурса кажется обрывающимся в воздухе. Особенно эффектно здесь в шторм, когда волны перехлёстывают через ограждение. В паре часов езды отсюда — легендарный серпантин Тролльстиген.\n\nНорвежские дороги вообще заслуживают отдельной поездки. Государство развивает систему национальных туристических маршрутов с продуманными смотровыми площадками, стоянками и даже архитектурными павильонами. Учтите лишь, что в Норвегии много платных дорог и паромов, а штрафы за превышение скорости очень высоки — ехать здесь стоит неспешно, как, впрочем, и требует сам пейзаж.\n\n## Чуйский тракт, Россия\n\nНаша главная дорога-легенда начинается в Новосибирске и уходит через Бийск и Горный Алтай к границе с Монголией. Протяжённость — около тысячи километров. Дорога проходит по долине Катуни, через перевалы Семинский и Чике-Таман, мимо Курайской степи с видом на снежные вершины Северо-Чуйского хребта. Исторически это торговый путь, по которому шли караваны, а в советское время — шофёрская трасса, воспетая в песнях.\n\nДля российского автопутешественника Чуйский тракт — почти обязательный пункт программы. Асфальт хороший на большей части пути, а пейзажи меняются от лесостепи до высокогорной полупустыни буквально за день.\n\nОтправляясь на Алтай, помните о горных условиях: погода меняется стремительно, на перевалах даже летом бывает холодно, а мобильная связь в глубине республики пропадает. Не пренебрегайте ограничениями скорости — тракт извилист, по нему ходят грузовики, а на дорогу нередко выходит скот. Зато сворачивая с основной трассы, можно найти Гейзерное озеро, долину реки Чулышман и Улаганский перевал, ради которых многие и едут в эти края.\n\n## Сравнение маршрутов\n\n| Маршрут | Страна | Длина | Лучшее время |\n|---|---|---|---|\n| Шоссе 66 | США | ≈3900 км | весна, осень |\n| Highway 1 (Биг-Сур) | США | ≈150 км отрезок | весна, осень |\n| Великая океанская дорога | Австралия | ≈240 км | ноябрь–апрель |\n| Трансфагарашское шоссе | Румыния | ≈90 км | июль–сентябрь |\n| Стельвио | Италия | перевал | июнь–сентябрь |\n| Атлантическая дорога | Норвегия | ≈8 км | лето, осенние шторма |\n| Чуйский тракт | Россия | ≈1000 км | июнь–сентябрь |\n\n## Как подготовиться к большой поездке\n\nКрасивая дорога не прощает небрежности. Несколько правил, которые сэкономят нервы:\n\n- **Проверьте открытие перевалов.** Высокогорные дороги в Альпах, Карпатах и Норвегии закрыты значительную часть года.\n- **Планируйте запас времени.** Средняя скорость на серпантинах редко превышает 30–40 км/ч, а остановки для фото съедают часы.\n- **Следите за тормозами.** На длинных спусках используйте торможение двигателем, чтобы не перегреть колодки и диски.\n- **Узнайте местные правила.** Платные дороги, экологические зоны, обязательные виньетки и требования к снаряжению отличаются от страны к стране.\n- **Заправляйтесь заранее.** На Чуйском тракте, в американской пустыне и на австралийском побережье расстояния между заправками могут удивить.\n\n> **Совет:** На горных дорогах выезжайте рано утром. Так вы избежите автобусов с туристами и колонн мотоциклистов, получите лучший свет для фотографий и успеете спуститься до того, как после обеда в горах начнут собираться облака.\n\n## Дорога как цель\n\nВеликие дороги объединяет одно: они превращают поездку в событие. Не нужно гнаться за всем списком сразу — выберите один маршрут, который откликается именно вам, и проезжайте его без спешки, с остановками и ночёвками по пути. Лучшие воспоминания об автопутешествиях почти всегда связаны не с пунктом назначения, а с поворотом, за которым неожиданно открылся вид, ради которого стоило ехать.","words":945,"minutes":5,"no":100},{"title":"Что можно обслуживать самому, а что лучше доверить сервису","slug":"diy-maintenance","category":"service","date":"2026-09-29","excerpt":"Замена щёток, ламп и салонного фильтра под силу любому, а вот ремень ГРМ и тормоза ошибок не прощают. Делим обслуживание на три уровня сложности и честно считаем, где экономия оправдана.","tags":["обслуживание","ремонт своими руками","гараж","сервис"],"facts":[{"label":"Под силу новичку","value":"щётки, лампы, фильтры"},{"label":"Нужен опыт","value":"масло, свечи, колодки"},{"label":"Только сервис","value":"ГРМ, АКПП, кондиционер"}],"body":"Когда-то обслуживать машину самому было нормой. Владелец «Жигулей» регулировал клапаны, менял масло и выставлял зажигание по стробоскопу, а в багажнике возил набор ключей. Современный автомобиль устроен иначе: под пластиковыми кожухами прячется электроника, многие операции требуют диагностического сканера, а ошибка может стоить дороже экономии. И всё же довольно многое по-прежнему можно и стоит делать своими руками.\n\n## Чем полезно обслуживать машину самому\n\nДело не только в деньгах, хотя экономия на простых работах бывает ощутимой. Владелец, который сам меняет фильтры и проверяет жидкости, гораздо лучше знает свою машину. Он раньше заметит потёк масла, трещину на патрубке или неравномерный износ шины. А ещё он точно знает, что именно залито и установлено, — без сомнений в духе «а поменяли ли фильтр на самом деле».\n\nНо у самостоятельного обслуживания есть и цена: время, инструмент, место для работы и риск ошибки. Поэтому полезно честно разделить все работы на уровни сложности.\n\n## Уровень первый: справится любой\n\nЭти операции не требуют специального инструмента, подъёмника и опыта. Достаточно руководства по эксплуатации и пятнадцати минут.\n\n- **Проверка уровней жидкостей** — масло, антифриз, тормозная жидкость, омыватель. Делать это стоит хотя бы раз в пару недель.\n- **Проверка давления в шинах** — раз в месяц и перед дальней поездкой, на холодных шинах.\n- **Замена щёток стеклоочистителя** — обычно меняются за минуту без инструмента.\n- **Замена салонного фильтра** — на большинстве машин он прячется за перчаточным ящиком.\n- **Замена воздушного фильтра двигателя** — корпус обычно открывается защёлками или парой винтов.\n- **Замена ламп** — габариты, стоп-сигналы, а на многих машинах и фары. Правда, на некоторых моделях ради лампы ближнего света приходится снимать бампер — это уже не про первый уровень.\n- **Замена предохранителей** — схема обычно нарисована на крышке блока.\n- **Уход за аккумулятором** — чистка клемм, подзарядка зарядным устройством.\n\n> **Совет:** заведите простую таблицу или заметку в телефоне и записывайте каждую операцию с датой и пробегом. Через пару лет это станет лучшей историей обслуживания вашей машины — и серьёзным аргументом при продаже.\n\n## Уровень второй: нужны опыт и инструмент\n\nДля этих работ понадобятся домкрат и подставки или смотровая яма, хороший набор головок, динамометрический ключ и аккуратность.\n\n### Замена масла и масляного фильтра\n\nКлассика гаражного обслуживания. Технически несложно, но есть подводные камни: правильный момент затяжки сливной пробки, новая уплотнительная шайба, утилизация отработки. Многие современные машины требуют сброса сервисного интервала через меню или сканер. А на некоторых моделях масляный фильтр и пробка находятся так, что без подъёмника до них не добраться.\n\n### Свечи зажигания\n\nНа рядных четырёхцилиндровых моторах с доступными катушками — вполне посильная работа. Главное — холодный двигатель, закручивание рукой первых витков и правильный момент. На V-образных моторах задний ряд свечей бывает спрятан под впускным коллектором, и тогда работа превращается в многочасовой разбор.\n\n### Тормозные колодки\n\nТехнически замена колодок несложна, и многие делают её сами. Но это система, от которой зависит жизнь. Нужно правильно утопить поршни, очистить и смазать направляющие суппорта, затянуть всё с нужным моментом и не испачкать диски смазкой. На машинах с электронным стояночным тормозом задние поршни разводят через сканер или специальный режим. Если вы не уверены в каждом шаге — это работа для сервиса.\n\n### Сезонная смена колёс\n\nПри наличии домкрата, баллонного ключа и динамометрического ключа — вполне посильно, если речь о перестановке комплекта на дисках. Важно затягивать гайки или болты крест-накрест и с моментом из руководства, а через несколько десятков километров проверить затяжку. Шиномонтаж и балансировка — уже работа для станка.\n\n### Минимальный набор для гаража\n\nЧтобы уверенно выполнять работы первого и второго уровня, хватит относительно скромного набора: хороший комплект торцевых головок с трещоткой, набор рожково-накидных ключей, отвёртки и биты, динамометрический ключ, подкатной домкрат с парой страховочных подставок, мультиметр, ёмкость для слива масла и налобный фонарик. Всё это окупится за несколько самостоятельных замен масла и колодок, а дальше будет служить годами.\n\n## Уровень третий: лучше в сервис\n\nЕсть работы, где цена ошибки слишком высока, а нужный инструмент слишком дорог для разового использования.\n\n| Работа | Почему лучше доверить сервису |\n|---|---|\n| Замена ремня или цепи ГРМ | Ошибка в метках — гнутые клапаны |\n| Обслуживание автоматической коробки | Нужен контроль уровня по температуре и сканер |\n| Заправка кондиционера | Нужна станция, вакуумирование и точная доза |\n| Замена тормозной жидкости с ABS | Блок ABS иногда прокачивают через сканер |\n| Развал-схождение | Требуется стенд |\n| Ремонт электроники и проводки | Нужна схема и диагностическое оборудование |\n| Работы с топливной системой высокого давления | Опасно и требует знаний |\n\nОтдельно стоит сказать про гибриды и электромобили. Высоковольтная часть таких машин работает под напряжением в сотни вольт. Лезть в неё без специального допуска и инструмента нельзя ни при каких обстоятельствах. Обычные расходники — щётки, салонный фильтр, двенадцативольтный аккумулятор — менять можно, а оранжевые высоковольтные кабели и разъёмы трогать нельзя.\n\n## Как не навредить себе и машине\n\nНесколько правил, которые сберегут здоровье и деньги:\n\n1. **Никогда не работайте под машиной, стоящей только на домкрате.** Используйте страховочные подставки или яму. Домкрат может соскользнуть или потерять давление.\n2. **Покупайте динамометрический ключ.** Это самый важный инструмент после набора головок: он спасает резьбу в алюминиевых деталях и колёсные шпильки.\n3. **Читайте инструкцию до начала работ.** Руководство по ремонту конкретной модели и тематические клубы владельцев — бесценный источник подсказок.\n4. **Покупайте качественные запчасти.** Дешёвый масляный фильтр сомнительного происхождения может стоить двигателя.\n5. **Утилизируйте отработку правильно.** Масло и антифриз принимают многие сервисы и пункты приёма — не сливайте их в землю.\n6. **Знайте, когда остановиться.** Если что-то пошло не так, а болт не откручивается, — лучше остановиться и вызвать мастера, чем сорвать грани или сломать деталь.\n\n### Гарантия и самостоятельное обслуживание\n\nЕсли машина на гарантии, внимательно изучите условия. Дилеры нередко требуют прохождения ТО у официальных сервисов, хотя на практике всё зависит от формулировок гарантийного договора. Безопаснее всего на гарантийный период делать сами только самые простые операции и сохранять все чеки на запчасти.\n\n## Разумный баланс\n\nСамостоятельное обслуживание — не про упрямство и не про экономию любой ценой. Простые операции первого уровня стоит освоить каждому: это быстро, дёшево и даёт понимание своей машины. Работы второго уровня — для тех, у кого есть место, инструмент и желание разобраться. А ГРМ, коробку, кондиционер и высоковольтную часть оставьте профессионалам: здесь цена ошибки в разы превышает стоимость работы мастера.","words":950,"minutes":5,"no":99},{"title":"Аэродинамика: почему форма кузова экономит топливо","slug":"aerodynamics","category":"tech","date":"2026-09-26","excerpt":"Почему на трассе машина тратит топливо в основном на борьбу с воздухом, что такое коэффициент Cx и как каплевидные кузова, хвост Камма и гладкое днище превращаются в литры и километры.","tags":["аэродинамика","расход","кузов","технологии"],"facts":[{"label":"Сопротивление воздуха","value":"растёт как v²"},{"label":"Мощность на преодоление","value":"растёт как v³"},{"label":"Cx серийных рекордсменов","value":"≈0,20"},{"label":"Cx типичного кроссовера","value":"≈0,30–0,40"}],"body":"В городской пробке аэродинамика почти не важна: машина ползёт, и воздух ей не мешает. Но стоит выехать на трассу, как всё меняется. На 110–130 км/ч большая часть энергии топлива или батареи уходит не на преодоление трения в шинах и не на подъёмы, а на то, чтобы растолкать перед собой воздух. Именно поэтому конструкторы годами шлифуют форму зеркал и ручек, а электромобили выглядят такими гладкими. Разберёмся, откуда берётся сопротивление и как с ним борются.\n\n## Физика встречного ветра\n\nСила аэродинамического сопротивления описывается простой формулой: она пропорциональна плотности воздуха, площади лобовой проекции машины, коэффициенту сопротивления и **квадрату скорости**. Удвойте скорость — и сила вырастет вчетверо.\n\nНо расход определяется не силой, а мощностью, которую нужно на неё тратить. Мощность — это сила, умноженная на скорость, поэтому она растёт уже **в кубе**. Если на 60 км/ч на борьбу с воздухом уходит условно 4 кВт, то на 120 км/ч — около 32 кВт. Вот почему разница в расходе между 110 и 140 км/ч ощущается так сильно, хотя скорости отличаются меньше чем на треть.\n\nНа малых скоростях доминирует сопротивление качению шин, которое от скорости почти не зависит. Где-то в районе 70–80 км/ч у обычного легкового автомобиля аэродинамика выходит вперёд, а дальше её доля быстро растёт.\n\n## Cx и лобовая площадь\n\nАэродинамическое совершенство кузова выражают безразмерным коэффициентом — в России его традиционно обозначают **Cx**, в англоязычных источниках — Cd. Он показывает, насколько «обтекаема» форма независимо от размера. Плоская пластина поперёк потока даёт около 1,2, идеальная капля — примерно 0,04.\n\nОднако сопротивление зависит от произведения Cx на площадь лобовой проекции. Огромный внедорожник с неплохим коэффициентом всё равно проиграет низкому седану с посредственным: у него просто больше «лоб». Поэтому инженеры сравнивают ещё и показатель CxA — эффективную площадь сопротивления.\n\n| Тип автомобиля | Типичный Cx |\n|---|---|\n| Рамный внедорожник | 0,40–0,50 и выше |\n| Современный кроссовер | 0,30–0,38 |\n| Массовый седан или хэтчбек | 0,27–0,32 |\n| Аэродинамичный электроседан | 0,20–0,24 |\n| Грузовой тягач с полуприцепом | 0,50–0,70 |\n\n## Немного истории\n\nАэродинамика пришла в автомобилестроение из авиации довольно рано. В 1921 году Эдмунд Румплер показал «Тропфенваген» — машину в форме капли, которая по поздним продувкам оказалась удивительно обтекаемой для своего времени. В 1930-х чешская Tatra выпустила T77 и T87 с длинными покатыми кормами и характерным плавником.\n\nПримерно тогда же немецкий инженер Вунибальд Камм доказал, что длинный «хвост» капли не обязателен. Если резко обрубить корму в нужном месте, поток срывается почти так же, как с полной капли, а машина получается короче и практичнее. **Хвост Камма** — вертикальный срез задней части — до сих пор узнаётся в силуэтах Toyota Prius и многих электромобилей.\n\nМассовое внимание к аэродинамике пришло после нефтяных кризисов 1970-х. Важной вехой стала Audi 100 третьего поколения 1982 года с Cx около 0,30 — рекорд для серийного седана своего времени, достигнутый за счёт вклеенных заподлицо стёкол и тщательной проработки деталей.\n\n## Где прячется сопротивление\n\nБольшая часть аэродинамических потерь возникает не там, где кажется. Нос машины обычно рассекает воздух вполне прилично, а основная беда — в задней части и снизу.\n\n### Корма и след\n\nЗа автомобилем образуется зона разрежения — турбулентный след, который буквально тянет машину назад. Чем он больше, тем выше сопротивление. Поэтому так важна форма кормы: аккуратные спойлеры, острые кромки на задних фонарях и диффузоры помогают потоку оторваться чисто и уменьшить след.\n\n### Днище\n\nПод обычной машиной — настоящие джунгли: выхлопная система, рычаги подвески, бак, балки. Всё это создаёт турбулентность. Плоские панели днища заметно снижают сопротивление, и на электромобилях это проще: плоская батарея сама по себе образует гладкий пол.\n\n### Колёса и арки\n\nВращающееся колесо в арке — один из главных источников потерь, по разным оценкам на него приходится до четверти всего сопротивления. Отсюда закрытые «аэродиски», воздушные шторки — узкие каналы в бампере, направляющие поток вдоль боковины колеса, — и аккуратные подкрылки.\n\n### Мелкие детали\n\n- Зеркала — вместе они могут давать несколько процентов общего сопротивления, поэтому их форму шлифуют в трубе часами.\n- Утопленные ручки дверей — убирают завихрения вдоль боковины.\n- **Активные жалюзи** в решётке радиатора — закрываются, когда охлаждение не нужно.\n- Дворники, спрятанные под кромкой капота.\n- Пневмоподвеска, опускающая кузов на скорости.\n\n## Сколько это в литрах и километрах\n\nЦифры полезно перевести на понятный язык. Грубое инженерное правило гласит: снижение аэродинамического сопротивления на 10% даёт на трассе экономию порядка 4–5% топлива. Для электромобиля это значит прибавку запаса хода на те же несколько процентов — а вес и стоимость батареи при этом не растут.\n\nПоэтому у электромобилей аэродинамика стала главным оружием. Батарея — самая дорогая часть машины, и каждый сэкономленный на сопротивлении воздуха киловатт-час означает, что для того же пробега можно поставить пакет поменьше, легче и дешевле. Отсюда и характерный облик многих электромобилей: закрытая «морда» без большой решётки, плавная линия крыши и обрубленная корма. Серийные рекордсмены вроде Mercedes-Benz EQS заявлены с Cx около 0,20, и у большинства новых электроседанов коэффициент укладывается в диапазон 0,21–0,24.\n\n> **Совет:** багажник на крыше — один из худших врагов расхода. Пустые поперечины и тем более бокс могут добавить на трассе от нескольких до двадцати с лишним процентов к расходу. Если бокс не нужен в ближайшие недели, снимите его.\n\n## Что может сделать водитель\n\nИзменить форму кузова вы не можете, а вот испортить её — запросто. Несколько привычек помогают сохранить заложенную инженерами эффективность:\n\n1. Снимайте поперечины, велокрепления и боксы, когда ими не пользуетесь.\n2. Не ездите с открытыми окнами на трассе — на высокой скорости кондиционер часто обходится дешевле.\n3. Не снимайте пластиковую защиту днища и подкрылки без нужды.\n4. Сбросьте скорость на 10 км/ч — на скорости выше 110 км/ч это ощутимо экономит топливо.\n5. Помните, что колёсные диски с «открытыми» спицами и широкие шины увеличивают сопротивление.\n\n## Форма решает\n\nАэродинамика — тот редкий случай, когда красота и экономия часто совпадают. Гладкий кузов, аккуратная корма и закрытое днище не стоят водителю ничего в повседневной эксплуатации, но на каждой поездке по трассе тихо возвращают литры топлива или киловатт-часы. Запомните главное: сопротивление воздуха растёт с квадратом скорости, а мощность на его преодоление — с кубом. Поэтому самая дешёвая аэродинамическая доработка — это лёгкое нажатие на педаль газа.","words":963,"minutes":5,"no":98},{"title":"Уход за кузовом: мойка, полировка и защита ЛКП","slug":"car-wash-paint-care","category":"service","date":"2026-09-23","excerpt":"Большинство царапин-паутинок появляется не на дороге, а на мойке. Рассказываем, как мыть машину без вреда для лака, когда полировать и чем отличаются воск, силанты и керамика.","tags":["кузов","мойка","полировка","детейлинг"],"facts":[{"label":"Толщина заводского ЛКП","value":"≈80–150 мкм"},{"label":"Слой лака","value":"≈30–50 мкм"},{"label":"Воск держится","value":"≈1–2 месяца"},{"label":"Керамика держится","value":"≈1–3 года"}],"body":"Лакокрасочное покрытие автомобиля — удивительно тонкая вещь. Весь «пирог» из грунта, базовой эмали и прозрачного лака на заводской машине обычно тоньше листа плотного картона. Именно этот слой защищает металл от коррозии и отвечает за то, как машина выглядит через пять лет. Парадокс в том, что больше всего ему вредят не камни на трассе, а неправильная мойка и привычка протирать пыльный кузов тряпкой.\n\n## Из чего состоит покрытие\n\nСовременное заводское ЛКП — многослойное. На металл наносят защитные слои, затем грунт, базовую эмаль, которая даёт цвет, и сверху — прозрачный лак. Общая толщина у большинства машин — порядка 80–150 микрон, из которых на лак приходится около 30–50.\n\nИменно лак принимает на себя все удары: мелкий песок, щётки, ультрафиолет, птичий помёт и реагенты. Когда вы видите на солнце круговые «паутинки» вокруг отражения лампы — это микроцарапины в лаковом слое. Полировка снимает часть лака, чтобы выровнять поверхность, поэтому злоупотреблять ею нельзя: запас толщины не бесконечен.\n\n## Как мыть, чтобы не царапать\n\n### Главный принцип: сначала убрать грязь, потом касаться\n\nПесок и дорожная пыль на кузове — это абразив. Если сразу пройтись по ним губкой, вы фактически отполируете машину наждачкой. Поэтому правильная мойка всегда начинается с бесконтактной стадии.\n\n1. **Предварительное ополаскивание.** Сбейте основную грязь струёй воды, начиная сверху.\n2. **Бесконтактный шампунь или активная пена.** Нанесите её снизу вверх, чтобы пена не стекала по сухим участкам, и дайте поработать несколько минут, не допуская высыхания.\n3. **Смыв.** Тщательно смойте пену вместе с размягчённой грязью — снова сверху вниз.\n4. **Контактная мойка.** Только теперь — мягкая варежка из микрофибры и шампунь для ручной мойки.\n5. **Финальное ополаскивание и сушка.**\n\n### Метод двух вёдер\n\nВ одном ведре — раствор шампуня, во втором — чистая вода. После каждой панели варежку полощут в ведре с водой, отжимают и только потом макают в шампунь. Так песок, снятый с кузова, остаётся во втором ведре, а не возвращается на лак. Простая хитрость, которая заметно снижает количество новых царапин.\n\nМойте от чистого к грязному: крыша, стёкла, капот, верх дверей и только в конце — пороги и низ бамперов. Для колёсных дисков нужна отдельная щётка и отдельное ведро: на дисках скапливается металлическая пыль от тормозных колодок, и переносить её на лак никак нельзя.\n\n### Сушка\n\nКапли воды, высохшие на солнце, оставляют известковые пятна, а на тёмных машинах они особенно заметны. Сушите кузов большим полотенцем из плотной микрофибры: кладите его на панель и протягивайте, не растирая с силой.\n\n> **Совет:** никогда не мойте машину под прямым солнцем и на горячем кузове. Шампунь и вода высыхают раньше, чем их успевают смыть, и оставляют разводы, которые потом приходится удалять полировкой.\n\n### А как же автоматическая мойка\n\nПортальная мойка со щётками — самый быстрый способ получить «паутинку». Щётки могут быть мягкими, но на них остаётся песок с предыдущих машин. Бесконтактные мойки безопаснее, однако агрессивная химия, которой там пользуются, со временем смывает защитные покрытия. Если выбирать, то бесконтактная мойка лучше портальной, а ручная — лучше обеих.\n\n## Очистка перед защитой\n\nДаже после идеальной мойки на кузове остаются загрязнения, которые не видно глазом: впившиеся частицы металла, битум, остатки смолы. Проведите ладонью в тонком пакете по капоту — если ощущается шершавость, лак загрязнён.\n\nДля этого существуют:\n\n- **очистители битума и смолы** — точечно удаляют чёрные точки на нижней части кузова;\n- **очистители металлических вкраплений** — меняют цвет, реагируя с железом, и смываются водой;\n- **глина** — специальная пластичная масса, которая по смазанной поверхности «собирает» въевшиеся загрязнения.\n\nПосле такой подготовки лак становится гладким, как стекло, и любое защитное покрытие ложится лучше и держится дольше.\n\n## Полировка: когда она действительно нужна\n\nПолировка бывает двух видов:\n\n- **абразивная (восстановительная)** — снимает тонкий слой лака вместе с царапинами, голограммами и следами окисления;\n- **финишная, защитная** — практически не снимает лак, а наносит блеск и защитный слой.\n\nАбразивную полировку не стоит делать чаще раза в несколько лет. Перед ней хороший мастер замеряет толщину покрытия толщиномером: на тонких участках, например на рёбрах и кромках, лак легко прожечь до базы. Самостоятельная машинная полировка без опыта — рискованное занятие, особенно роторной машинкой. Эксцентриковая машинка прощает больше ошибок, но тренироваться всё равно лучше на старой детали.\n\nГлубокие царапины, в которых виден грунт или металл, полировка не уберёт. Их нужно подкрашивать или перекрашивать деталь.\n\n### Сколы и мелкие повреждения\n\nСколы на капоте и переднем бампере неизбежны, особенно после зимы и летних поездок по трассе. Их не стоит оставлять на потом: если скол дошёл до металла, влага быстро запустит коррозию, и под краской начнёт расползаться рыжее пятно. Небольшой скол можно аккуратно закрыть подкрашивающим карандашом или тонкой кистью по коду краски, который указан на табличке в проёме двери или под капотом. Идеально скрыть повреждение так не выйдет, но металл будет защищён — а это главное.\n\n## Защитные покрытия: сравнение\n\n| Покрытие | Срок службы | Плюсы | Минусы |\n|---|---|---|---|\n| Натуральный воск | ≈1–2 месяца | Тёплый глубокий блеск | Недолговечен |\n| Синтетический силант | ≈3–6 месяцев | Простое нанесение, гидрофоб | Блеск «холоднее» |\n| Керамическое покрытие | ≈1–3 года | Твёрдость, стойкость к химии | Дорого, требует подготовки |\n| Защитная плёнка | Несколько лет | Защита от сколов | Самый дорогой вариант |\n\nВажно понимать, чего ждать. Ни воск, ни керамика не защищают от камней на трассе и не делают лак неуязвимым для царапин. Их задача — облегчить мойку, отталкивать воду и грязь, защитить от ультрафиолета и химии. От сколов спасает только полиуретановая плёнка — её обычно клеят на капот, передний бампер, фары и зеркала.\n\n## Сезонные мелочи\n\n- **Зимой** мойте машину регулярно, даже если она снова испачкается: реагенты и соль разъедают и лак, и металл, особенно в скрытых полостях. Не забывайте промыть днище и колёсные арки.\n- **Весной** — время глубокой очистки и обновления защитного слоя после реагентов.\n- **Летом** сразу удаляйте птичий помёт, смолу и следы насекомых: на жаре они быстро въедаются в лак и оставляют матовые пятна.\n- **Осенью** — нанесите свежую защиту перед зимой.\n\n## Что изменить уже на этой неделе\n\nХороший внешний вид машины зависит от привычек больше, чем от дорогих средств. Мойте бесконтактно, затем аккуратно и двумя вёдрами, сушите микрофиброй, не трите сухую пыль и не загоняйте машину в портальную мойку со щётками. Добавьте к этому слой защиты пару раз в год — и абразивная полировка понадобится вам очень нескоро.","words":947,"minutes":5,"no":97},{"title":"Автомат, вариатор или робот: чем отличаются коробки передач","slug":"automatic-transmissions","category":"tech","date":"2026-09-21","excerpt":"Две педали в салоне могут скрывать три совершенно разных механизма. Объясняем, как устроены классический автомат, вариатор и роботизированная коробка и что выбрать под свой стиль езды.","tags":["техника","трансмиссия","акпп","вариатор"],"facts":[{"label":"Первый массовый автомат","value":"Hydra-Matic, 1940"},{"label":"Ступеней у автоматов","value":"обычно 6–10"},{"label":"Первый вариатор DAF","value":"конец 1950-х"},{"label":"DSG на Golf","value":"с 2003 года"}],"body":"Садишься в машину, видишь селектор с буквами P, R, N, D — и кажется, что всё понятно: автомат. Но под этим привычным интерфейсом может работать любой из трёх принципиально разных механизмов. У каждого своя логика, свой характер в езде и свои слабые места. Разница проявляется не только в ощущениях за рулём, но и в стоимости обслуживания, ресурсе и поведении машины в пробке или на бездорожье.\n\n## Зачем вообще нужна коробка\n\nДвигатель внутреннего сгорания эффективно работает лишь в определённом диапазоне оборотов, а колёсам нужно вращаться и медленно при трогании, и быстро на трассе. Коробка передач согласует одно с другим, меняя передаточное отношение. В механике это делает водитель педалью сцепления и рычагом. Все автоматические коробки решают ту же задачу без участия человека — но каждая по-своему.\n\n## Классический автомат: гидротрансформатор и планетарки\n\nГидромеханическая коробка — самый старый и до сих пор распространённый тип. Первым массовым автом
